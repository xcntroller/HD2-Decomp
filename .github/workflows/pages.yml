name: Deploy project website

on:
  push:
    branches: [master]
  workflow_dispatch:

# Only the deploy job can publish. No personal access token is needed.
permissions:
  contents: read

# Keep an active deployment intact; GitHub retains the newest pending run.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.repository == 'xcntroller/HD2-Decomp' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    defaults:
      run:
        working-directory: website
    env:
      # This is already a public push/dispatch revision, not a local upstream.
      HD2_PUBLIC_REF: ${{ github.sha }}
    steps:
      - name: Check out the exact workflow revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0 # Required for activity history and public commit links.
          persist-credentials: false
          lfs: false
          submodules: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7
        with:
          python-version: '3.13'

      - name: Set up Node and cache npm downloads
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: website/.nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json

      - name: Check Pages configuration
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: false # Select Settings > Pages > GitHub Actions manually.

      - name: Install locked website dependencies
        run: npm ci --no-audit --no-fund

      - name: Check existing analyzer tests
        run: python3 -B -m unittest discover -s ../tools -p 'test_function_progress.py'

      - name: Generate, validate, build and audit the public website
        # build = current analyzer + versioned research join -> strict validation -> tsc -> Vite
        # -> artifact audit. Validation errors stop before bundling or uploading.
        run: npm run build

      - name: Upload only the audited static output
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: website/dist
          retention-days: 1

  deploy:
    if: github.repository == 'xcntroller/HD2-Decomp' && github.ref == 'refs/heads/master'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the validated artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
